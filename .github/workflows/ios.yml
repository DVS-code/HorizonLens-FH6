name: Build iPhone app (unsigned, for sideloading)

on:
  push:
    paths: ["ios/**", "web/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: ios

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project HorizonLens.xcodeproj -scheme HorizonLens \
            -configuration Release -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build | tee xcodebuild.log | grep -E "error:|warning:|BUILD (SUCCEEDED|FAILED)" || true
          test -d build/Build/Products/Release-iphoneos/HorizonLens.app

      - name: Package the .ipa
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/HorizonLens.app Payload/
          zip -qry HorizonLens-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: HorizonLens-iPhone
          path: ios/HorizonLens-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: ios/xcodebuild.log
